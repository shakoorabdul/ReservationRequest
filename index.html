<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservation Request</title>
    <link rel="stylesheet" href="styles.css">
    <script src="reservation.js"></script>
</head>
<body>
    <main>
        <h1>Reservation Request</h1>

        <form id="reservation_form" action="response.html" method="get">
            <!-- General Information Section -->
            <fieldset>
                <legend>General Information</legend>
                
                <div class="row">
                    <label for="arrival_date">Arrival date:</label>
                    <input type="text" id="arrival_date" name="arrival_date">
                    <span id="arrival_date_error" class="error"></span>
                </div>

                <div class="row">
                    <label for="nights">Nights:</label>
                    <input type="text" id="nights" name="nights">
                    <span id="nights_error" class="error"></span>
                </div>

                <div class="row">
                    <label for="adults">Adults:</label>
                    <select id="adults" name="adults">
                        <option value="1">1</option>
                        <option value="2" selected>2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                    </select>
                </div>

                <div class="row">
                    <label for="children">Children:</label>
                    <select id="children" name="children">
                        <option value="0" selected>0</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                    </select>
                </div>
            </fieldset>

            <!-- Preferences Section -->
            <fieldset>
                <legend>Preferences</legend>

                <div class="row">
                    <label>Room type:</label>
                    <input type="radio" name="room_type" id="standard" value="Standard" checked>
                    <label for="standard" class="inline-label">Standard</label>
                    <input type="radio" name="room_type" id="business" value="Business">
                    <label for="business" class="inline-label">Business</label>
                    <input type="radio" name="room_type" id="suite" value="Suite">
                    <label for="suite" class="inline-label">Suite</label>
                </div>

                <div class="row">
                    <label>Bed type:</label>
                    <input type="radio" name="bed_type" id="king" value="King" checked>
                    <label for="king" class="inline-label">King</label>
                    <input type="radio" name="bed_type" id="double" value="Double Double">
                    <label for="double" class="inline-label">Double Double</label>
                </div>

                <div class="row checkbox-row">
                    <input type="checkbox" name="smoking" id="smoking" value="yes">
                    <label for="smoking" class="inline-label">Smoking</label>
                </div>
            </fieldset>

            <!-- Contact Information Section -->
            <fieldset>
                <legend>Contact Information</legend>

                <div class="row">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name">
                    <span id="name_error" class="error"></span>
                </div>

                <div class="row">
                    <label for="email">Email:</label>
                    <input type="text" id="email" name="email">
                    <span id="email_error" class="error"></span>
                </div>

                <div class="row">
                    <label for="phone">Phone:</label>
                    <input type="text" id="phone" name="phone">
                    <span id="phone_error" class="error"></span>
                </div>
            </fieldset>

            <div class="buttons">
                <input type="submit" id="submit_request" value="Submit Request">
            </div>
        </form>
    </main>

    <!-- Requirement: Student information footer -->
    <footer>
        <p>&copy; Abdul Shakoor (N10009278) 2026</p>
    </footer>
</body>
</html>
